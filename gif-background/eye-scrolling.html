<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视差滚动</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <img src="bg.jpg" id="bg">
        <img src="moon.png" id="moon" >
        <img src="mountain.png"  id="moutain" >
        <img src="road.png"  id="road" >
        <h2 id="text">Moon night</h2>
    </section>
    <script type="text/javascript">
        let bg=document.getElementById("bg");
        let moon=document.getElementById("moon");
        let mountain=document.getElementById("moutain");
        let road=document.getElementById("road");
        let text=document.getElementById("text");

        window.addEventListener('scroll',function(){
            var value=window.scrollY;
            bg.style.top=value*0.5+'px';
            moon.style.right=value*0.2+'px';
            mountain.style.bottom=-value*0.3+'px';
            road.style.bottom=value*0.01+'px'
            text.style.top=value*1+'px'
        })
    </script>
</body>

</html>
